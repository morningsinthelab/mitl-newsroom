        body: `
          <p><strong>TORONTO, ONTARIO, CANADA \u2014 May 2026</strong> \u2014 MiTL Studio, the live conversation studio behind Mornings in the Lab, today released its first formal thesis on the structural opportunity reshaping morning television: the morning daypart has migrated to YouTube and streaming, but virtually no one is programming for it as a daily live destination. While legacy network morning shows have lost nearly half their viewers over the past decade, the audience has not disappeared \u2014 it has moved, and it is being served almost nothing built for it.</p>

          <p>The thesis arrives at a moment of crisis for traditional morning television. According to Forbes, \u201CToday\u201D has lost 45% of its viewership over the comparable period (from 4.71 million to 2.6 million viewers), and \u201CCBS Mornings\u201D has dropped 47% (<a href="https://www.forbes.com/sites/maryroeloffs/2026/04/22/how-the-morning-news-late-night-shows-lost-half-their-viewers/">Forbes, April 22, 2026</a>). At the same time, YouTube has captured a structural lead in the streaming category, accounting for 12.6% of all time spent streaming in the US \u2014 more than any other streamer (<a href="https://www.emarketer.com/content/youtube-ctv-growth-pricing-edge-boost-2026-streaming-outlook">Nielsen via eMarketer</a>) \u2014 and pulling 47% of total time spent streaming with YouTube included (<a href="https://www.nielsen.com/news-center/2026/tv-viewing-hits-12-month-high-in-nielsens-january-report-of-the-gauge/">Nielsen, The Gauge, January 2026</a>).</p>

          <p>The migration is not theoretical. According to a January 2026 Morning Consult brand study, YouTube TV showed a \u201Cvery strong Mental Advantage (+11) on catching morning news shows \u2014 one of the clearest signals in the entire matrix.\u201D Netflix scored -12, Prime -7, and Max -7 on the same metric (<a href="https://morningconsult.com/articles/youtube-tv-brand-strength-live-sports-news-streaming-netflix-hulu-amazon-prime">Morning Consult</a>). Morning is daily, habitual, and time-specific. It is structurally incompatible with binge-first platforms.</p>

          <blockquote>\u201CThe networks are losing the morning because they keep producing for a 1995 viewer who doesn\u2019t exist anymore. There are 165 million monthly podcast listeners in the US. There are tens of millions of adults watching YouTube on their TV before work. And the only thing being made for them in the morning daypart is the same three network shows that have lost half their audience. We are not waiting for the networks to figure it out. We are building the show that should already exist.\u201D<br><br>\u2014 <strong>Keith Bilous</strong>, Founder, MiTL Studio</blockquote>

          <h3>The Numbers Behind the Thesis</h3>

          <ul>
            <li>Morning network television has lost ~46% of viewers across \u201CToday\u201D and \u201CCBS Mornings\u201D over the past decade (<a href="https://www.forbes.com/sites/maryroeloffs/2026/04/22/how-the-morning-news-late-night-shows-lost-half-their-viewers/">Forbes</a>).</li>
            <li>Streaming now accounts for 66.7% of ad-supported TV time among 18\u201349-year-olds (<a href="https://www.nielsen.com/news-center/2026/nielsen-launches-2026-upfront-planning-series-with-new-datato-help-marketers-and-agencies-unlock-growth-innovation-opportunities/">Nielsen, March 2026</a>).</li>
            <li>92% of US adults use at least one streaming service, and 55% of consumers are streaming-only with no cable (<a href="https://natlawreview.com/press-releases/state-tv-2026-report-finds-streaming-dominates-viewing-while-cable-retains">CableTV.com State of TV 2026</a>).</li>
            <li>YouTube holds the strongest Mental Advantage (+11) for catching morning news, the clearest single signal in Morning Consult\u2019s brand-association matrix (<a href="https://morningconsult.com/articles/youtube-tv-brand-strength-live-sports-news-streaming-netflix-hulu-amazon-prime">Morning Consult</a>).</li>
            <li>165 million monthly US podcast listeners \u2014 55% of the 12+ population \u2014 consume podcasts regularly, with YouTube now commanding 25%+ of US podcast consumption (<a href="https://www.digitalapplied.com/blog/podcast-statistics-2026-advertising-data">Digital Applied / Edison Research Infinite Dial 2026</a>).</li>
            <li>Video-first interview podcasts grew 34% year-over-year \u2014 the fastest-growing podcast format (<a href="https://www.digitalapplied.com/blog/podcast-statistics-2026-advertising-data">Digital Applied</a>).</li>
          </ul>

          <h3>What Mornings in the Lab Has Built</h3>

          <p>Mornings in the Lab streams every weekday at 8:00 AM ET on YouTube, and has not missed a single live broadcast in over 1,000 consecutive hours \u2014 a perfect attendance record now in its third season. The show is built around the MiTL Format, a reusable show chassis with named blocks (Morning Loop, Center Stage, Deep Dive, Morning Focus, Community Corner) designed for daily live production, repurposable clips, and a recognizable structure across 1,700+ episodes.</p>

          <p>The thesis is not just observation \u2014 it is operating proof. Mornings in the Lab is the only daily live morning show built natively for YouTube, with a reusable format chassis, a live conversation audience, and a content engine that produces clips, podcasts, newsletters, and now \u2014 with the launch of the MiTL Conversation Desk in April \u2014 localized AI-powered editorial coverage of all 32 NHL markets at <a href="https://universe.mitl.studio">universe.mitl.studio</a>.</p>

            <strong>What is the Morning Daypart Thesis?</strong>
            <p>The thesis argues that the morning television audience has migrated to YouTube and streaming, but no one is programming a daily live morning show built natively for that environment. Network morning TV has lost nearly half its viewers over the past decade, while YouTube now commands the largest share of streaming time and the strongest brand association for morning news. Mornings in the Lab is the operating proof of what a YouTube-native morning show looks like.</p>
