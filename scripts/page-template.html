<!DOCTYPE html>
<!-- MiTL Studio Newsroom - v2.1 -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Newsroom — MiTL Studio</title>
  <meta name="description" content="Official press releases and news from MiTL Studio, the live conversation and community studio founded by Keith Bilous.">
  <meta property="og:title" content="Newsroom — MiTL Studio">
  <meta property="og:description" content="Official press releases and news from MiTL Studio and Mornings in the Lab.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://newsroom.mitl.studio/">
  <link rel="canonical" href="https://newsroom.mitl.studio/">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "CollectionPage",
    "name": "MiTL Studio Newsroom",
    "description": "Official press releases and news from MiTL Studio, the live conversation and community studio founded by Keith Bilous.",
    "url": "https://newsroom.mitl.studio/",
    "publisher": {
      "@type": "Organization",
      "name": "MiTL Studio",
      "url": "https://mitl.studio",
      "founder": {
        "@type": "Person",
        "name": "Keith Bilous",
        "url": "https://keithbilous.com"
      },
      "sameAs": [
        "https://youtube.com/@MorningsintheLab",
        "https://youtube.com/@KeithIntheLab",
        "https://linkedin.com/in/keithbilous",
        "https://morningsinthelab.com",
        "https://insidethelab.live",
        "https://universe.mitl.studio",
        "https://lookinmymirror.com",
        "https://podcasts.apple.com/us/podcast/mornings-in-the-lab-with-keith-friends/id1735637203",
        "https://keithbilous.com",
        "https://x.com/MorningsintheLab"
      ]
    }
  }
  </script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #020617;
      color: #ffffff;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .font-sync { font-family: 'Syncopate', sans-serif; }

    /* Navigation */
    nav {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: transparent;
      padding: 0;
    }

    .nav-inner {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 72px;
      gap: 24px;
    }

    nav a {
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      font-family: 'Syncopate', sans-serif;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: color 0.2s;
      white-space: nowrap;
    }

    nav a:hover { color: #fff; }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #fff;
      flex-shrink: 0;
    }

    .nav-brand img {
      height: 36px;
      width: auto;
    }

    .nav-tagline {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      color: rgba(255,255,255,0.45);
      line-height: 1.3;
      max-width: 180px;
      letter-spacing: 0;
      text-transform: none;
      font-weight: 400;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      align-items: center;
    }

    .nav-cta {
      font-family: 'Syncopate', sans-serif;
      display: inline-flex;
      align-items: center;
      padding: 10px 24px;
      background: #fbbf24;
      color: #0a0f1a !important;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      border-radius: 4px;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background 0.2s;
    }

    .nav-cta:hover {
      background: #e5b635;
      color: #0a0f1a !important;
    }

    .nav-accent { color: #fbbf24 !important; font-weight: 700 !important; }

    /* Hero */
    .hero {
      padding: 10rem 2rem 4rem;
      text-align: center;
      max-width: 900px;
      margin: 0 auto;
    }

    .hero-label {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #fbbf24;
      margin-bottom: 1.5rem;
    }

    .hero h1 {
      font-family: 'Syncopate', sans-serif;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      line-height: 1.15;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
      text-shadow: 0 0 40px rgba(251, 191, 36, 0.15);
    }

    .hero p {
      font-size: 1.1rem;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.7);
      max-width: 640px;
      margin: 0 auto;
    }

    /* Releases */
    .releases {
      max-width: 860px;
      margin: 0 auto;
      padding: 2rem 2rem 6rem;
    }

    .release-card {
      border: 1px solid rgba(251, 191, 36, 0.2);
      border-radius: 8px;
      padding: 2.5rem;
      margin-bottom: 2rem;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(8px);
      transition: border-color 0.3s;
    }

    .release-card:hover {
      border-color: rgba(251, 191, 36, 0.5);
    }

    .release-date {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #fbbf24;
      margin-bottom: 1rem;
    }

    .release-card h2 {
      font-family: 'Inter', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 1rem;
    }

    .release-card h2 a {
      color: #ffffff;
      text-decoration: none;
      transition: color 0.2s;
    }

    .release-card h2 a:hover { color: #fbbf24; }

    .release-excerpt {
      font-size: 0.95rem;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.65);
      margin-bottom: 1.5rem;
    }

    .read-more {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fbbf24;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .read-more:hover { opacity: 0.8; }

    /* Individual Release Page */
    .release-full {
      max-width: 740px;
      margin: 0 auto;
      padding: 10rem 2rem 6rem;
    }

    .release-full .release-date {
      margin-bottom: 1.5rem;
    }

    .release-full h1 {
      font-family: 'Inter', sans-serif;
      font-size: clamp(1.5rem, 3.5vw, 2.2rem);
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 2.5rem;
    }

    .release-body {
      font-size: 1rem;
      line-height: 1.8;
      color: rgba(255, 255, 255, 0.8);
    }

    .release-body p {
      margin-bottom: 1.5rem;
    }

    .release-body h3 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffffff;
      margin: 2.5rem 0 1rem;
    }

    .release-body blockquote {
      border-left: 3px solid #fbbf24;
      padding-left: 1.5rem;
      margin: 2rem 0;
      font-style: italic;
      color: rgba(255, 255, 255, 0.9);
    }

    .release-body strong {
      color: #ffffff;
      font-weight: 600;
    }

    .release-body a {
      color: #fbbf24;
      text-decoration: none;
    }

    .release-body a:hover { text-decoration: underline; }

    .release-body ul {
      list-style: none;
      padding: 0;
      margin: 1rem 0 1.5rem;
    }

    .release-body ul li {
      padding: 0.35rem 0 0.35rem 1.25rem;
      position: relative;
    }

    .release-body ul li::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0.85rem;
      width: 6px;
      height: 6px;
      background: #fbbf24;
      border-radius: 50%;
    }

    .faq-item {
      margin-bottom: 1.5rem;
    }

    .faq-item strong {
      display: block;
      margin-bottom: 0.35rem;
      color: #ffffff;
    }

    .boilerplate {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid rgba(251, 191, 36, 0.15);
    }

    .boilerplate h3 {
      margin-bottom: 0.75rem;
    }

    .link-list {
      list-style: none;
      padding: 0;
      margin: 1rem 0;
    }

    .link-list li {
      padding: 0.25rem 0;
    }

    .link-list li::before { display: none; }

    .back-link {
      display: inline-block;
      margin-bottom: 2rem;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #fbbf24;
      text-decoration: none;
    }

    .back-link:hover { opacity: 0.8; }

    /* Footer */
    footer {
      border-top: 1px solid rgba(251, 191, 36, 0.15);
      padding: 2.5rem 2rem;
      text-align: center;
    }

    footer p {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
    }

    footer a {
      color: rgba(255, 255, 255, 0.5);
      text-decoration: none;
    }

    footer a:hover { color: #fbbf24; }

    /* Responsive */
    @media (max-width: 1100px) {
      .nav-links { gap: 16px; }
      .nav-links a { font-size: 10px; letter-spacing: 0.06em; }
      .nav-cta { padding: 8px 16px; font-size: 10px; }
    }

    @media (max-width: 768px) {
      .nav-inner { height: 60px; padding: 0 16px; }
      .nav-tagline { display: none; }
      .nav-links { gap: 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
      .nav-links::-webkit-scrollbar { display: none; }
      .nav-hide-mobile { display: none; }
      .nav-cta { padding: 8px 14px; font-size: 9px; }
      .hero { padding: 8rem 1.25rem 3rem; }
      .releases { padding: 1.5rem 1.25rem 4rem; }
      .release-card { padding: 1.75rem; }
      .release-full { padding: 8rem 1.25rem 4rem; }
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <div class="nav-inner">
      <a href="https://mitl.studio" class="nav-brand">
        <img src="https://universe.mitl.studio/mitl-logo.png" alt="MiTL Studio">
        <span class="nav-tagline">Founded by Keith Bilous, creator of the MiTL morning format.</span>
      </a>
      <div class="nav-links">
        <a href="https://universe.mitl.studio/correspondents/" class="nav-hide-mobile">Correspondents</a>
        <a href="https://universe.mitl.studio/cast/" class="nav-hide-mobile">Cast</a>
        <a href="https://universe.mitl.studio/feed/" class="nav-hide-mobile">Feed</a>
        <a href="https://globe.mornings.live" class="nav-hide-mobile">Globe</a>
        <a href="https://mornings.live" class="nav-hide-mobile">Show</a>
        <a href="https://mitl.studio/investors" class="nav-accent nav-hide-mobile">Investors</a>
      </div>
      <a href="mailto:mornings@bapl.ai" class="nav-cta">Book a Call</a>
    </div>
  </nav>

  <!--APP-->
  <div id="app"></div>
  <!--/APP-->

  <!-- Footer -->
  <footer>
    <p>&copy; 2026 MiTL Studio. Founded by <a href="https://keithbilous.com">Keith Bilous</a>. &nbsp;|&nbsp; <a href="https://youtube.com/@MorningsintheLab">YouTube</a> &nbsp;|&nbsp; <a href="https://linkedin.com/in/keithbilous">LinkedIn</a> &nbsp;|&nbsp; <a href="https://mitl.studio">mitl.studio</a></p>
  </footer>

  <script>
    // Old ?release=<slug> links now live at /releases/<slug>/
    (function () {
      var slug = new URLSearchParams(window.location.search).get('release');
      if (slug && /^[a-z0-9-]+$/.test(slug)) window.location.replace('/releases/' + slug + '/');
    })();
  </script>
</body>
</html>
